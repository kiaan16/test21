<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create an account | FoodBridge AI</title><link rel="stylesheet" href="css/styles.css"></head><body class="auth-page"><a class="brand auth-brand" href="index.html"><span class="brand-mark">F</span>FoodBridge <em>AI</em></a><main class="auth-layout"><aside class="auth-aside"><span class="eyebrow light">JOIN THE COMMUNITY</span><h1>Every helping<br>hand matters.</h1><p>Choose how you would like to take part in making food sharing easier and more accountable.</p></aside><section class="auth-panel"><span class="eyebrow">GET STARTED</span><h2>Create your account</h2><p class="muted">Tell us a little about yourself.</p><form id="register-form"><div class="form-grid"><label>Full name<input name="fullName" required maxlength="80" placeholder="Your full name"></label><label>Email address<input type="email" name="email" required placeholder="you@example.com"></label><label>Phone number<input type="tel" name="phone" required minlength="8" maxlength="16" placeholder="Contact number"></label><label>Area / City<input name="area" required maxlength="100" placeholder="Your area or city"></label></div><label>I am joining as<select name="role" id="role" required><option value="">Select your role</option><option value="donor">Food Donor</option><option value="receiver">Person in Need (Receiver)</option><option value="distributor">Distributor</option><option value="organisation">Food Organisation</option></select></label><div id="organisation-fields" class="conditional" hidden><label>Organisation name<input name="organisationName" placeholder="Registered organisation name"></label><label>Organisation type<select name="organisationType"><option value="">Select type</option><option>NGO</option><option>Charitable trust</option><option>Orphanage</option><option>Old-age home</option><option>Community kitchen</option><option>Food bank</option><option>Other</option></select></label></div><label>Create password<input type="password" name="password" required minlength="8" placeholder="At least 8 characters"></label><label class="check"><input type="checkbox" name="terms" required><span>I agree to use FoodBridge responsibly and provide accurate information.</span></label><button class="button button-primary full" type="submit">Create account →</button><p id="form-message" class="message" role="status"></p></form><p class="switch">Already registered? <a href="login.html">Log in</a></p><a class="back" href="index.html">← Back to home</a></section></main><script type="module" src="js/register.js"></script></body></html>
